name: Deploy browser MPC to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6"

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot export templates
        run: |
          if [ "$HOME" != "/root" ]; then
            mkdir -p "$HOME/.config" "$HOME/.local/share/godot/export_templates"
            mv /root/.config/godot "$HOME/.config/godot" || true
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
               "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" || true
          fi
          godot --headless --version

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export single-threaded Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html || true
          test -f build/web/index.html

      - name: Add browser MPC controller
        run: cp web/mpc_controller.js build/web/mpc_controller.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
